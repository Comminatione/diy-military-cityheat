name: Build ARM64 Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Modules & Sync Capacitor
        run: |
          node build-modular.js
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (arm64-v8a)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diy-military-cityheat-arm64-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
